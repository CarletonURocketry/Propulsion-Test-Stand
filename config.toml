[server]
addr = '127.0.0.1'
port = 65431

[relays]
#Valve = 'Board.Number'
xv1 = 'A.1'
xv2 = 'A.2'
xv3 = 'A.3'
xv4 = 'A.4'
XV5 = 'B.1'
xv6 = 'B.2'

[servos]
#Servo = 'Board.Number'
fire = 'F.1'
disconnect = 'F.2'

[motors]

[sensor]
temp = {t1 = 'T.1', t2 = 'T.2'} # TC is thermouple sensor, T.# is RTD ADC inputs
pressure = {pi1 = 'P.1', pi2 = 'P.2'} # Pressure sensor, P.# is Pressure Transducer ADC inputs
load = {l1 = 'L.1', l2 = 'm'} # Load cell, L.# is Load Cell ADC inputs, m is strain gauge ADC input


[switch]
XV1 = 'A.1'
XV2 = 'A.2'
XV3 = 'A.3'
XV4 = 'A.4'
XV5 = 'B.1'
XV6 = 'B.2'

[leds]
#ledID = 'outputID'

[data]
format = {time = ["elapsedTime", "serverTime"], pressures = ["pi1","pi2"], temps = ["t1","t2"], relays = ["xv1", "xv2", "xv3", "xv4", "xv5", "xv6"], loads = ["L1", "dm"], servos = ["fire", "disconnect"], ignitor = ["continuity", "fired"]}

[control]
format = {relays = ["xv1", "xv2", "xv3", "xv4", "xv5", "xv6"], servos = ["fire", "disconnect"]}

[log]
path = "Logs/"
name = "testLog" # Current date, time and file extension are appended to the name
